[project]
name = "treasury-signals"
version = "0.1.0"
description = "10Y US Treasury trading signal dashboard with autoresearch loop"
requires-python = ">=3.10"
dependencies = [
    # Data
    "fredapi>=0.5.0",
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.26",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyarrow>=14.0",
    # Signals - statistical
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "hmmlearn>=0.3",
    "arch>=6.3",
    "pykalman>=0.9",
    "nelson-siegel-svensson>=0.5",
    "scipy>=1.12",
    # Signals - positioning
    # "cot-reports>=0.1",  # install manually: pip install cot-reports
    # Signals - NLP
    "vaderSentiment>=3.3",
    "pdfminer.six>=20221105",
    # Backtest
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
